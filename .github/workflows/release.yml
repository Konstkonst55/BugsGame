name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bugsgame-release.jks"
          test -s "$RUNNER_TEMP/bugsgame-release.jks"

      - name: Read release key alias
        id: signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KEY_ALIAS="$(keytool -list -keystore "$RUNNER_TEMP/bugsgame-release.jks" -storepass "$KEYSTORE_PASSWORD" | awk -F, 'NR == 2 {print $1}')"
          test -n "$KEY_ALIAS"
          echo "::add-mask::$KEY_ALIAS"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
        run: |
          gradle :app:clean :app:assembleRelease --stacktrace             -PkeystorePath="$RUNNER_TEMP/bugsgame-release.jks"             -PkeystorePassword="$KEYSTORE_PASSWORD"             -PkeyAlias="$KEY_ALIAS"             -PkeyPassword="$KEY_PASSWORD"

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk BugsGame.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "BugsGame.apk" --title "BugsGame ${GITHUB_REF_NAME}" --generate-notes
