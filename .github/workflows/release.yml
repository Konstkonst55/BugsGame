name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            RELEASE_TAG="$PUSH_TAG"
          fi

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v"
              exit 1
              ;;
          esac

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bugsgame-release.jks"
          test -s "$RUNNER_TEMP/bugsgame-release.jks"

      - name: Resolve and verify signing key
        id: signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEY_ALIAS="$(
            keytool -list               -keystore "$RUNNER_TEMP/bugsgame-release.jks"               -storepass "$KEYSTORE_PASSWORD"               -v |
              awk -F': ' '/^Alias name: / {print $2; exit}'
          )"

          test -n "$KEY_ALIAS"

          keytool -list             -keystore "$RUNNER_TEMP/bugsgame-release.jks"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"             -keypass "$KEY_PASSWORD"             > /dev/null

          echo "::add-mask::$KEY_ALIAS"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gradle :app:clean :app:assembleRelease --stacktrace             -PkeystorePath="$RUNNER_TEMP/bugsgame-release.jks"             -PkeystorePassword="$KEYSTORE_PASSWORD"             -PkeyAlias="$KEY_ALIAS"             -PkeyPassword="$KEY_PASSWORD"

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk BugsGame.apk

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" BugsGame.apk --clobber
          else
            gh release create "$RELEASE_TAG" BugsGame.apk               --title "BugsGame $RELEASE_TAG"               --generate-notes
          fi
